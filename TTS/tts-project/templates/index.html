<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text to MP3</title>
<style>
  :root{
    --bg:#eceeed; --panel:#fafaf8; --ink:#17201c; --muted:#5d6a64; --line:#c9d0cc;
    --accent:#0f5c4d; --accent-ink:#fff; --track:#d9dfdb; --err:#a8261c;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141a17; --panel:#1c2420; --ink:#e7ece9; --muted:#9aa8a1; --line:#33403a;
           --accent:#4fb79f; --accent-ink:#06211a; --track:#2b3631; --err:#ff8a7e; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);padding:28px 16px 48px;
       font:16px/1.55 system-ui,"Segoe UI",sans-serif}
  main{max-width:780px;margin:0 auto}
  h1{font:600 30px/1.2 Georgia,"Iowan Old Style",serif;margin:0 0 6px;letter-spacing:-.01em}
  .sub{margin:0 0 22px;color:var(--muted)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px}
  .bar-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
  .stats{color:var(--muted);font-size:14px}
  textarea{width:100%;min-height:260px;resize:vertical;padding:12px;border:1px solid var(--line);
           border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
  textarea.drag{outline:2px dashed var(--accent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .row{display:flex;gap:14px;flex-wrap:wrap;margin:16px 0}
  .field{flex:1 1 190px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
  select{padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);
         color:var(--ink);font:inherit}
  input[type=range]{width:100%;accent-color:var(--accent)}
  button{font:inherit;font-weight:600;border-radius:6px;padding:11px 20px;cursor:pointer;
         border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  button.small{padding:6px 12px;font-weight:500;font-size:14px}
  button:disabled{opacity:.55;cursor:not-allowed}
  .actions{display:flex;gap:10px;align-items:center}
  #progress{display:none;margin-top:18px}
  .track{height:10px;background:var(--track);border-radius:5px;overflow:hidden}
  .fill{height:100%;width:0;background:var(--accent);transition:width .3s}
  #msg{margin-top:8px;font-size:14px;color:var(--muted)}
  #hint{color:var(--muted);font-size:14px;min-height:1.2em;margin:-4px 0 12px}
  #err{color:var(--err);margin-top:12px;min-height:1.3em}
  #result{display:none;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
  audio{width:100%;margin-bottom:12px}
  a.dl{display:inline-block;text-decoration:none;background:var(--accent);color:var(--accent-ink);
       font-weight:600;padding:11px 20px;border-radius:6px}
  input[type=file]{display:none}
</style>
</head>
<body>
<main>
  <h1>Text to MP3</h1>
  <p class="sub">Paste English or Arabic text (Fusha or Egyptian) of any length, or drop a .txt file. Long texts are converted in parts.</p>

  <div class="panel">
    <div class="bar-top">
      <div class="actions">
        <label for="file"><button type="button" class="small" onclick="document.getElementById('file').click()">Open .txt file</button></label>
        <input id="file" type="file" accept=".txt,text/plain">
        <button type="button" class="small" id="clear">Clear</button>
      </div>
      <div class="stats"><span id="words">0</span> words · <span id="chars">0</span> / {{ "{:,}".format(max_chars) }} characters</div>
    </div>

    <textarea id="text" dir="auto" placeholder="Type or paste text here..."></textarea>

    <div class="row">
      <label class="field">Language
        <select id="lang">
          {% for k, v in languages.items() %}
          <option value="{{ k }}" {{ 'selected' if k == default_lang }}>{{ v.label }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="field">Engine
        <select id="engine">
          <option value="edge">Edge (natural voices)</option>
          <option value="gtts">Google (basic)</option>
        </select>
      </label>
      <label class="field" id="voiceWrap">Voice
        <select id="voice"></select>
      </label>
      <label class="field">Speed: <span id="speedVal">1.0</span>x
        <input id="speed" type="range" min="0.5" max="2" step="0.1" value="1">
      </label>
    </div>

    <div id="hint"></div>

    <div class="actions">
      <button class="primary" id="go">Convert to MP3</button>
      <button id="cancel" disabled>Cancel</button>
    </div>

    <div id="progress">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div id="msg"></div>
    </div>
    <div id="err" role="alert"></div>

    <div id="result">
      <audio id="player" controls></audio>
      <a class="dl" id="dl" download="speech.mp3">Download MP3</a>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const MAX = {{ max_chars }};
let jobId = null, timer = null;

function updateStats(){
  const t = $("text").value;
  $("chars").textContent = t.length.toLocaleString();
  $("words").textContent = (t.trim() ? t.trim().split(/\s+/).length : 0).toLocaleString();
}
$("text").addEventListener("input", () => { updateStats(); autoLang(); });
$("clear").onclick = () => { $("text").value = ""; updateStats(); };
$("speed").oninput = e => $("speedVal").textContent = (+e.target.value).toFixed(1);
const LANGS = {{ languages|tojson }};
let langTouched = false;

function fillVoices(){
  const l = LANGS[$("lang").value];
  $("voice").innerHTML = Object.entries(l.voices).map(
    ([k, v]) => `<option value="${k}"${k === l.default ? " selected" : ""}>${v}</option>`).join("");
  // Egyptian Arabic is only available with the Edge engine
  $("engine").querySelector('option[value="gtts"]').disabled = !l.gtts;
  if(!l.gtts && $("engine").value === "gtts") $("engine").value = "edge";
  $("voiceWrap").style.display = $("engine").value === "edge" ? "" : "none";
  $("hint").textContent = $("lang").value === "ar-eg" && !l.gtts
    ? "Egyptian dialect uses the Edge engine." : "";
}
function autoLang(){
  if(langTouched) return;
  const t = $("text").value;
  if(t.length < 20) return;
  const ar = (t.match(/[\u0600-\u06FF]/g) || []).length;
  const lat = (t.match(/[A-Za-z]/g) || []).length;
  const want = ar > lat ? "ar" : "en";
  if($("lang").value !== want){
    $("lang").value = want; fillVoices();
    if(want === "ar") $("hint").textContent = "Arabic detected - using Fusha. Choose Egyptian from Language if you want the Egyptian accent.";
  }
}
$("lang").onchange = () => { langTouched = true; fillVoices(); };
$("engine").onchange = fillVoices;

function loadFile(f){
  if(!f) return;
  const r = new FileReader();
  r.onload = () => { $("text").value = r.result; updateStats(); autoLang(); };
  r.readAsText(f);
}
$("file").onchange = e => loadFile(e.target.files[0]);
$("text").addEventListener("dragover", e => { e.preventDefault(); $("text").classList.add("drag"); });
$("text").addEventListener("dragleave", () => $("text").classList.remove("drag"));
$("text").addEventListener("drop", e => {
  e.preventDefault(); $("text").classList.remove("drag"); loadFile(e.dataTransfer.files[0]);
});

function busy(on){
  $("go").disabled = on; $("cancel").disabled = !on;
  $("progress").style.display = "block";
}

$("go").onclick = async () => {
  $("err").textContent = ""; $("result").style.display = "none";
  const text = $("text").value;
  if(!text.trim()){ $("err").textContent = "Paste or type some text first."; return; }
  if(text.length > MAX){ $("err").textContent = "Text is too long."; return; }
  busy(true); $("fill").style.width = "0"; $("msg").textContent = "Starting...";
  try{
    const r = await fetch("/api/jobs", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({text, lang:$("lang").value, engine:$("engine").value, voice:$("voice").value, speed:+$("speed").value})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || "Request failed");
    jobId = d.id; timer = setInterval(poll, 1000); poll();
  }catch(e){ fail(e.message); }
};

async function poll(){
  try{
    const d = await (await fetch(`/api/jobs/${jobId}`)).json();
    if(d.total){
      $("fill").style.width = (100*d.done/d.total) + "%";
      $("msg").textContent = `Converting part ${d.done} of ${d.total}`;
    }
    if(d.status === "done"){
      clearInterval(timer); busy(false); $("fill").style.width = "100%";
      $("msg").textContent = "Done.";
      $("player").src = `/api/jobs/${jobId}/audio`;
      $("dl").href = `/api/jobs/${jobId}/audio?download=1`;
      $("result").style.display = "block";
    } else if(d.status === "error"){ fail(d.error);
    } else if(d.status === "cancelled"){ clearInterval(timer); busy(false); $("msg").textContent = "Cancelled."; }
  }catch(e){ fail("Lost connection to the server."); }
}
function fail(m){ clearInterval(timer); busy(false); $("progress").style.display="none"; $("err").textContent = m; }
$("cancel").onclick = async () => {
  $("msg").textContent = "Cancelling after the current part...";
  await fetch(`/api/jobs/${jobId}/cancel`, {method:"POST"});
};
updateStats();
fillVoices();
</script>
</body>
</html>
