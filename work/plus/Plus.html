<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plus</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8ecef;--ink:#12263a;--card:#fff;--line:#d5dce2;--chip:#12263a;--chipfg:#fff;--chiph:#c8372d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e161e;--ink:#e8eef3;--line:#26343f;--chip:#12263a;--chiph:#c8372d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e161e;--ink:#e8eef3;--line:#26343f;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;min-height:100vh}
main{max-width:440px;margin:0 auto;padding:44px 20px 56px}
header{text-align:center;margin-bottom:32px}
.star{width:34px;height:34px;display:block;margin:0 auto 10px}
h1{font-weight:300;font-size:3.4rem;letter-spacing:.14em;margin:0 0 0 .14em;line-height:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 22px 20px;margin-bottom:14px;display:flex;flex-direction:column;align-items:center;gap:20px}
.logo{height:110px;width:100%;display:flex;align-items:center;justify-content:center}
.logo img{max-width:100%;max-height:100%;object-fit:contain}
.wm{font-weight:500;font-size:1.7rem;letter-spacing:.06em;color:#12263a;text-align:center}
.soc{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.soc a{width:44px;height:44px;border-radius:50%;background:var(--chip);color:var(--chipfg);display:grid;place-items:center;transition:background .2s,transform .2s}
.soc a:hover{background:var(--chiph);transform:translateY(-2px)}
.soc a:focus-visible{outline:3px solid var(--chiph);outline-offset:3px}
.soc svg{width:22px;height:22px}
@media (prefers-reduced-motion:reduce){.soc a{transition:none}.soc a:hover{transform:none}}
</style></head>
